name: Trove CI (build and upload)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      # Allow GitHub to request an OIDC JWT ID token, for exchange with AWS STS
      id-token: write
      contents: read
      # Required to comment on pull requests with Riff-Raff deployment links
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: 'npm'
      - run: npm ci
        name: 'install dependencies'
      - run: npm run format:check
        name: 'format check'
      - run: npm run lint:check
        name: 'lint check'
      - run: npm test
        name: 'run tests'
      - run: npm run typecheck
        name: 'typecheck'
      - run: npm run synth --workspace=cdk
        name: '[CDK] synth'
      - uses: guardian/actions-riff-raff@v4
        name: 'upload to Riff-Raff'
        with:
          projectName: capi::trove
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # riff-raff.yaml is generated by `cdk synth`
          configPath: cdk/cdk.out/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - cdk/cdk.out
